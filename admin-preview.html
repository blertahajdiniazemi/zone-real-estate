  boshFund: "dhe pyesni çfarë vjen së shpejti.", shtoFoto: "SHTO FOTO"
};

/* JSON.stringify e bën arratisjen e saktë të thonjëzave, prapaviçave dhe
   rreshtave të rinj. Gjenerimi me dorë e humbte rreshtin e ri. */
const j = (v) => JSON.stringify(v == null ? "" : v);

/**
 * Fushat që dërgohen te listings.js.
 *
 * KUJDES: listings.js është skedar PUBLIK në një depo publike.
 * Asgjë private nuk guxon të kalojë këtej — as shënime të brendshme,
 * as të dhëna klientësh, as kontrata, as komisione. Lista më poshtë
 * është e qëllimshme dhe e mbyllur: fushat shtohen me dorë, kurrë me
 * një cikël mbi objektin.
 */
function publicShape(p, featuredRank) {
  const out = {};

  /* --- Fushat e vjetra, për përputhshmëri --- */
  out.title = p.title;
  out.status = transactionLabel(p.transactionType);   // "Për shitje" / "Me qira"
  out.price = displayPrice(p);
  out.beds = p.beds || 0;
  out.baths = p.baths || 0;
  out.size = displaySize(p);
  out.location = composeLocation(p);
  out.summary = p.summary;
  out.details = p.details || p.summary;
  out.features = p.features;
  out.image = p.coverImage;                            // = coverImage

  /* --- Fushat e reja --- */
  out.id = p.id;
  out.code = p.code;
  out.transactionType = p.transactionType;
  out.lifecycle = p.lifecycle;
  out.published = lifecycleIsPublic(p.lifecycle);
  out.category = p.category;

  out.priceValue = p.priceValue;
  out.currency = p.currency;
  out.negotiable = p.negotiable;

  out.city = p.city;
  out.municipality = p.municipality;
  out.neighborhood = p.neighborhood;
  out.address = p.address;
  out.latitude = p.latitude;
  out.longitude = p.longitude;

  out.sizeValue = p.sizeValue;
  out.plotSize = p.plotSize;
  out.rooms = p.rooms;
  out.floor = p.floor;
  out.totalFloors = p.totalFloors;
  out.yearBuilt = p.yearBuilt;
  out.parking = p.parking;
  out.garage = p.garage;
  out.orientation = p.orientation;
  out.condition = p.condition;

  out.coverImage = p.coverImage;
  out.images = p.images;

  out.featured = p.featured === true;
  out.featuredOrder = p.featured ? featuredRank : null;

  out.slug = effectiveSlug(p);
  out.metaTitle = p.metaTitle;
  out.metaDescription = p.metaDescription;

  out.publishedAt = p.publishedAt;
  out.updatedAt = p.updatedAt;

  return out;
}

/** Renditja e pronave të veçuara: featuredOrder, pastaj renditja e listës. */
function featuredRanking(properties) {
  const rank = new Map();
  properties
    .filter((p) => p.featured)
    .slice()
    .sort((a, b) => {
      const ao = a.featuredOrder == null ? 9999 : a.featuredOrder;
      const bo = b.featuredOrder == null ? 9999 : b.featuredOrder;
      return ao - bo || a._order - b._order;
    })
    .forEach((p, i) => rank.set(p.id, i));
  return rank;
}

/**
 * Ndërton përmbajtjen e plotë të listings.js.
 * Rezultati duhet të përmbajë "window.ZONE_CONFIG" — funksioni serverik
 * e refuzon çdo skedar që nuk e ka, si mbrojtje kundër publikimit të
 * një skedari të prishur.
 */
function buildListingsFile(site, properties) {
  const text = site.TEXT || DEFAULT_TEXT;
  const rank = featuredRanking(properties);
  const L = [];

  L.push("/* =====================================================================");
  L.push("   ZONE REAL ESTATE — SKEDARI I PRONAVE");
  L.push("   =====================================================================");
  L.push("   Gjeneruar nga Paneli Administrativ më " + fmt.dateTime(new Date()));
  L.push("");
  L.push("   MOS E NDRYSHONI ME DORË. Ndryshimet do të mbishkruhen te");
  L.push("   publikimi i radhës nga paneli.");
  L.push("");
  L.push("   Ky skedar është PUBLIK. Ai përmban vetëm informacion që lejohet");
  L.push("   të shfaqet në uebfaqe — asnjë e dhënë klienti, kontrate apo");
  L.push("   shënim i brendshëm nuk ruhet këtu.");
  L.push("   ===================================================================== */");
  L.push("");

  L.push("const DISPLAY_PHONE = " + j(site.DISPLAY_PHONE) + ";");
  L.push("const CALL_PHONE    = " + j(site.CALL_PHONE) + ";");
  L.push("");
  L.push("const CITY         = " + j(site.CITY) + ";");
  L.push("const LAST_UPDATED = " + j(site.LAST_UPDATED) + ";");
  L.push("");

  L.push("const TEXT = {");
  const keys = Object.keys(text);
  keys.forEach((k, i) => {
    const safeKey = /^[A-Za-z_$][A-Za-z0-9_$]*$/.test(k) ? k : j(k);
    L.push("  " + safeKey + ": " + j(text[k]) + (i < keys.length - 1 ? "," : ""));
  });
  L.push("};");
  L.push("");

  L.push("const listings = [");
  properties.forEach((p, idx) => {
    const o = publicShape(p, rank.has(p.id) ? rank.get(p.id) : null);
    L.push("");
    L.push("  {");

    const entries = Object.entries(o);
    entries.forEach(([key, value], i) => {
      const comma = i < entries.length - 1 ? "," : "";

      if (Array.isArray(value)) {
        if (!value.length) { L.push("    " + key + ": []" + comma); return; }
        L.push("    " + key + ": [");
        value.forEach((v, k) => L.push("      " + j(v) + (k < value.length - 1 ? "," : "")));
        L.push("    ]" + comma);
        return;
      }

      if (value === null) { L.push("    " + key + ": null" + comma); return; }
      if (typeof value === "number" || typeof value === "boolean") {
        L.push("    " + key + ": " + value + comma);
        return;
      }
      L.push("    " + key + ": " + j(value) + comma);
    });

    L.push("  }" + (idx < properties.length - 1 ? "," : ""));
  });
  L.push("");
  L.push("];");
  L.push("");
  L.push("window.ZONE_CONFIG = { DISPLAY_PHONE, CALL_PHONE, CITY, LAST_UPDATED, TEXT, listings };");
  L.push("");

  return L.join("\n");
}

/**
 * Lexon një listings.js ekzistues pa e ekzekutuar në faqen tonë.
 * Skedari vjen nga depoja jonë përmes funksionit serverik, por
 * gjithsesi ekzekutohet me një objekt `window` bosh, që të mos prekë
 * asnjë gjendje reale të panelit.
 */
function parseListingsFile(content) {
  const fn = new Function("window", content + "\nreturn window.ZONE_CONFIG;");
  const cfg = fn({});
  if (!cfg || !Array.isArray(cfg.listings)) {
    throw new Error("listings.js nuk u lexua dot.");
  }
  return cfg;
}

/** Verifikon që kodi i gjeneruar është i vlefshëm PARA se të dërgohet.
 *  Një skedar i prishur do ta linte faqen publike pa asnjë pronë. */
function verifyGenerated(code, expectedCount) {
  const cfg = parseListingsFile(code);
  if (cfg.listings.length !== expectedCount) {
    throw new Error("Numri i pronave nuk përputhet me atë që u gjenerua.");
  }

 */
function toast(title, options = {}) {

  const root = ensureToastRoot();

  const node = el("div", { class: "toast toast--" + type }, [
    (() => { const i = icon(TOAST_ICON[type] || "info"); i.classList.add("toast__icon"); return i; })(),
    el("div", { class: "toast__body" }, [
      el("div", { class: "toast__title", text: title }),
      options.text ? el("div", { class: "toast__text", text: options.text }) : null
    ]),
    el("button", {
      class: "toast__close", type: "button", "aria-label": "Mbyll njoftimin",
      onclick: () => dismiss()
    }, [icon("close", 13)])
  ]);

  let timer;
  function dismiss() {
    clearTimeout(timer);
    if (!node.isConnected) return;
    node.classList.add("is-leaving");
    setTimeout(() => node.remove(), 170);
  }

  root.appendChild(node);
  /* Gabimet rrinë më gjatë: ato kërkojnë veprim, jo vetëm vëmendje. */
  timer = setTimeout(dismiss, options.duration || (type === "error" ? 7000 : 4000));

  return dismiss;
}

/** Base64 që i mbijeton shkronjave shqipe (btoa vetëm mbi bajtë). */
function utf8ToB64(str) {
  const bytes = new TextEncoder().encode(str);
  let bin = "";
  for (let i = 0; i < bytes.length; i++) bin += String.fromCharCode(bytes[i]);
  return btoa(bin);
}

function blobToB64(blob) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = () => resolve(String(reader.result).split(",")[1]);
    reader.onerror = () => reject(new Error("Fotoja nuk u lexua dot."));
    reader.readAsDataURL(blob);
  });
}

/* Kufijtë. Serveri e refuzon çdo gjë mbi 3 MB, prandaj zvogëlimi bëhet
   para nisjes — jo pas një gabimi. */
const MAX_WIDTH = 1600;
const MAX_UPLOAD_BYTES = 2.6 * 1024 * 1024;
const MAX_SOURCE_BYTES = 25 * 1024 * 1024;
const MAX_IMAGES_PER_PROPERTY = 20;
const ACCEPTED_TYPES = ["image/jpeg", "image/png", "image/webp"];

const QUALITY_STEPS = [0.84, 0.74, 0.64, 0.54];

/* Validimi                                                            */
/* ------------------------------------------------------------------ */

/** Kthen "" kur skedari është në rregull, ose mesazhin shqip të gabimit. */
function validateFile(file) {
  if (!file) return "Skedari nuk u lexua dot.";

  /* Lloji kontrollohet nga MIME, jo nga prapashtesa. Kjo ndalon
     ngarkimin e skedarëve të ekzekutueshëm me emër ".jpg". */
  if (!ACCEPTED_TYPES.includes(file.type)) {
    return "Fotografia nuk është në format të mbështetur. Përdorni JPG, PNG ose WebP.";
  }
  if (file.size > MAX_SOURCE_BYTES) {
    return "Fotografia është shumë e madhe (mbi 25 MB).";
  }
  if (file.size === 0) {
    return "Fotografia është bosh.";
  }
  return "";
}

function toCanvasBlob(canvas, type, quality) {
  return new Promise((resolve, reject) => {
    canvas.toBlob(
      (blob) => (blob ? resolve(blob) : reject(new Error("Fotografia nuk u përpunua dot."))),
      type, quality
    );

    img.onerror = () => { URL.revokeObjectURL(url); reject(new Error("Fotografia është e dëmtuar ose e papërdorshme.")); };
    img.src = url;

async function processImage(file, baseName) {
  const img = await loadImage(file);

  let width = img.naturalWidth || img.width;
  let height = img.naturalHeight || img.height;
  if (!width || !height) throw new Error("Fotografia është e dëmtuar ose e papërdorshme.");

  if (width > MAX_WIDTH) {
    height = Math.round(height * MAX_WIDTH / width);
    width = MAX_WIDTH;

  canvas.width = width;
  canvas.height = height;

  ctx.imageSmoothingQuality = "high";

  ctx.fillStyle = "#140C1C";   // = --site-canvas, sfondi i faqes publike

  let blob = null;
  for (const quality of QUALITY_STEPS) {
    blob = await toCanvasBlob(canvas, "image/jpeg", quality);
    if (blob.size <= MAX_UPLOAD_BYTES) break;

    name: makeFileName(baseName),

/**
 * Ndërton bllokun e medias për formularin e pronës.
 *
 * @param {object} options
 * @param {object} options.property   prona që po redaktohet (ndryshohet drejtpërdrejt)
 * @param {Function} options.onChange thirret pas çdo ndryshimi
 * @param {string} options.siteBase   adresa e faqes live, për fotot ekzistuese
 */
function createMediaManager({ property, onChange, siteBase }) {
  const container = ui.el("div");
  const fileInput = ui.el("input", {
    type: "file", accept: ACCEPTED_TYPES.join(","), multiple: true, hidden: true
  });

  const grid = ui.el("div", { class: "media-grid" });
  const status = ui.el("p", { class: "hint", "aria-live": "polite" });

  const dropzone = ui.el("div", {
    class: "dropzone", role: "button", tabindex: "0",
    "aria-label": "Ngarko fotografi"
  }, [
    ui.el("div", { class: "dropzone__icon" }, [ui.icon("upload")]),
    ui.el("div", { class: "dropzone__title", text: "Tërhiqni fotografitë këtu ose klikoni për t'i zgjedhur" }),
    ui.el("div", {
      class: "dropzone__hint",
      text: "JPG, PNG ose WebP · deri në " + MAX_IMAGES_PER_PROPERTY +
            " fotografi · zvogëlohen vetë në " + MAX_WIDTH + "px"
    })
  ]);

  /* ---------------- Ngarkimi ---------------- */

  async function handleFiles(fileList) {
    const files = [...fileList];
    if (!files.length) return;

    const room = MAX_IMAGES_PER_PROPERTY - property.images.length;
    if (room <= 0) {
      ui.toast("Kufiri i fotografive u arrit.", {
        type: "warning",
        text: "Një pronë mban deri në " + MAX_IMAGES_PER_PROPERTY + " fotografi."
      });
      return;
    }

    const batch = files.slice(0, room);
    if (files.length > room) {
      ui.toast("U pranuan vetëm " + batch.length + " fotografi.", {
        type: "warning",
        text: "Kufiri për një pronë është " + MAX_IMAGES_PER_PROPERTY + "."
      });
    }

    let done = 0;
    let failed = 0;
    status.textContent = "Duke përpunuar fotografitë…";

    for (const file of batch) {
      const problem = validateFile(file);
      if (problem) {
        failed++;
        ui.toast(problem, { type: "error", text: file.name });
        continue;
      }

      try {
        const processed = await processImage(file, property.title || property.code);
        const path = "images/" + processed.name;

        store.addPendingImage(processed.name, processed);
        property.images.push(path);
        if (!property.coverImage) property.coverImage = path;

        done++;
        status.textContent = "U përpunuan " + done + " nga " + batch.length + " fotografi…";
        render();
      } catch (e) {
        failed++;
        ui.toast("Fotografia nuk u ngarkua.", { type: "error", text: file.name + " — " + e.message });
      }
    }

    status.textContent = "";
    if (done) {
      ui.toast(
        done === 1 ? "Fotografia u shtua." : done + " fotografi u shtuan.",
        { text: "Ato ngarkohen në uebfaqe kur të publikoni." }
      );
    }
    if (failed && !done) status.textContent = "Asnjë fotografi nuk u shtua.";
    onChange();
  }

  dropzone.addEventListener("click", () => fileInput.click());
  dropzone.addEventListener("keydown", (e) => {
    if (e.key === "Enter" || e.key === " ") { e.preventDefault(); fileInput.click(); }
  });
  fileInput.addEventListener("change", (e) => {
    handleFiles(e.target.files);
    e.target.value = "";
  });

  for (const evt of ["dragenter", "dragover"]) {
    dropzone.addEventListener(evt, (e) => { e.preventDefault(); dropzone.classList.add("is-over"); });
  }
  for (const evt of ["dragleave", "drop"]) {
    dropzone.addEventListener(evt, (e) => { e.preventDefault(); dropzone.classList.remove("is-over"); });
  }
  dropzone.addEventListener("drop", (e) => {
    if (e.dataTransfer && e.dataTransfer.files.length) handleFiles(e.dataTransfer.files);
  });

  /* ---------------- Veprimet mbi një foto ---------------- */

  function setCover(path) {
    property.coverImage = path;
    onChange();
    render();
    ui.toast("Fotoja kryesore u ndryshua.");
  }

  function remove(path) {
    property.images = property.images.filter((p) => p !== path);
    if (property.coverImage === path) property.coverImage = property.images[0] || "";

    /* Nëse fotoja ishte ende e panisur, hiqet edhe nga radha e ngarkimit —
       s'ka pse të dërgohet një skedar që askush nuk e përdor. */
    const name = path.replace(/^images\//, "");
    if (store.get().pendingImages[name]) store.removePendingImage(name);

    onChange();
    render();
  }

  function reorder(fromIndex, toIndex) {
    if (fromIndex === toIndex || toIndex < 0 || toIndex >= property.images.length) return;
    const [moved] = property.images.splice(fromIndex, 1);
    property.images.splice(toIndex, 0, moved);
    onChange();
    render();
  }

  /* ---------------- Vizatimi ---------------- */

  let dragIndex = -1;

  function render() {
    ui.clear(grid);

    property.images.forEach((path, index) => {
      const isCover = path === property.coverImage;
      const name = path.replace(/^images\//, "");
      const isNew = !!store.get().pendingImages[name];

      const item = ui.el("div", {
        class: "media-item" + (isCover ? " is-cover" : ""),
        draggable: "true",
        dataset: { index: String(index) }
      }, [
        ui.el("img", {
          class: "media-item__img",
          src: store.imageSource(path, ui.PLACEHOLDER, siteBase),
          alt: "Fotografia " + (index + 1) + (isCover ? " — kryesore" : ""),
          loading: "lazy",
          onerror: function () { this.onerror = null; this.src = ui.PLACEHOLDER; }
        }),
        isCover ? ui.el("span", { class: "media-item__flag", text: "Kryesore" }) : null,
        isNew ? ui.el("span", { class: "media-item__new", text: "E re" }) : null,
        ui.el("div", { class: "media-item__bar" }, [
          ui.el("span", { class: "media-item__name", text: name, title: name }),
          ui.el("div", { class: "media-item__acts" }, [
            /* Zhvendosja me butona ekziston sepse tërheqja me maus nuk
               punon me tastierë dhe është e vështirë në telefon. */
            ui.el("button", {
              class: "media-item__btn", type: "button",
              "aria-label": "Zhvendos majtas", disabled: index === 0,
              onclick: () => reorder(index, index - 1)
            }, [ui.icon("chevronLeft", 13)]),
            ui.el("button", {
              class: "media-item__btn", type: "button",
              "aria-label": "Zhvendos djathtas", disabled: index === property.images.length - 1,
              onclick: () => reorder(index, index + 1)
            }, [ui.icon("chevronRight", 13)]),
            isCover ? null : ui.el("button", {
              class: "media-item__btn", type: "button",
              "aria-label": "Vendos si kryesore", title: "Vendos si Kryesore",
              onclick: () => setCover(path)
            }, [ui.icon("star", 13)]),
            ui.el("button", {
              class: "media-item__btn media-item__btn--danger", type: "button",
              "aria-label": "Hiq fotografinë",
              onclick: () => remove(path)
            }, [ui.icon("trash", 13)])
          ])
        ])
      ]);

      item.addEventListener("dragstart", (e) => {
        dragIndex = index;
        item.classList.add("is-dragging");
        e.dataTransfer.effectAllowed = "move";
        /* Firefox kërkon që diçka të vendoset, përndryshe tërheqja nuk nis. */
        e.dataTransfer.setData("text/plain", String(index));
      });
      item.addEventListener("dragend", () => {
        dragIndex = -1;
        item.classList.remove("is-dragging");
        [...grid.children].forEach((c) => c.classList.remove("is-dropzone"));
      });
      item.addEventListener("dragover", (e) => {
        e.preventDefault();
        if (dragIndex >= 0 && dragIndex !== index) item.classList.add("is-dropzone");
      });
      item.addEventListener("dragleave", () => item.classList.remove("is-dropzone"));
      item.addEventListener("drop", (e) => {
        e.preventDefault();
        item.classList.remove("is-dropzone");
        if (dragIndex >= 0) reorder(dragIndex, index);
      });

      grid.appendChild(item);
    });

    grid.hidden = !property.images.length;
    countLine.textContent = property.images.length
      ? property.images.length + " fotografi · e para në renditje nuk është domosdo kryesorja"
      : "";
  }

  const countLine = ui.el("p", { class: "hint" });

  container.append(
    dropzone,
    fileInput,
    status,
    grid,
    countLine,
    ui.el("div", { class: "callout mt-4" }, [
      ui.icon("info"),
      ui.el("div", {
        html: "<b>Foto Kryesore</b> është ajo që shfaqet në kartelën e pronës dhe në ballinë. " +
              "Përdorni yllin për ta ndryshuar, ose tërhiqni fotografitë për t'i renditur."
      })
    ])
  );

  render();

  return { node: container, render };
}

  return { validateFile, processImage, makeFileName, createMediaManager, MAX_WIDTH, MAX_UPLOAD_BYTES, MAX_SOURCE_BYTES, MAX_IMAGES_PER_PROPERTY, ACCEPTED_TYPES };
})();

/* =====================================================================

     1 Informacioni Bazë   5 Karakteristikat

   Dy sjellje janë të qëllimshme:

const TABS = [

const CITY_SUGGESTIONS = [

/**
 * Hap redaktuesin.

 */

    property ? model.normalizeProperty(property, property._order) : model.blankProperty(all)
  ));
  const original = JSON.stringify(draft);

  let activeTab = 0;
  let errors = {};
  let touched = false;

  /* ---------------------------------------------------------------- */

  /* ---------------------------------------------------------------- */

  const tabBar = ui.el("div", { class: "tabs", role: "tablist" });

    [ui.icon("check"), isNew ? "Shto Pronën" : "Ruaj Ndryshimet"]);
  const previewBtn = ui.el("button", { class: "btn btn--ghost", type: "button" },
    [ui.icon("eye"), "Shiko Paraprakisht"]);
  const cancelBtn = ui.el("button", { class: "btn btn--ghost", type: "button" }, ["Anulo"]);

  const dirtyFlag = ui.el("span", { class: "text-xs muted", hidden: true },
    ["Keni ndryshime të paruajtura."]);

  const modal = ui.openModal({
    title: isNew ? "Shto Pronë" : "Ndrysho Pronën",
    subtitle: isNew ? null : draft.code + " · " + (draft.title || "Pa titull"),
    size: "full",
    closeOnBackdrop: false,
    flush: true,
    body: ui.el("div", {}, [
      ui.el("div", { style: "padding:0 var(--sp-5)" }, [tabBar]),
      ui.el("div", { style: "padding:0 var(--sp-5) var(--sp-5)" }, [panel])
    ]),
    footer: ui.el("div", { class: "row grow", style: "width:100%" }, [
      ui.el("div", { class: "modal__foot-start row row--tight" }, [dirtyFlag]),
      previewBtn, cancelBtn, saveBtn
    ]),
    onClose: () => {}
  });

  /* Mbyllja kalon gjithmonë nga rojtari i ndryshimeve. */
  const nativeClose = modal.close;
  modal.close = function guardedClose(force) {
    if (force === true || !hasChanges()) { nativeClose(); return; }
    guardExit();
  };
  ui.$(".modal__close", modal.modal).addEventListener("click", (e) => {
    e.stopPropagation();
    modal.close();
  }, true);
  cancelBtn.addEventListener("click", () => modal.close());

  function hasChanges() {
    return JSON.stringify(draft) !== original;
  }

  /* Puna nuk humbet kurrë në heshtje. */
  async function guardExit() {

      tone: "warning",

  }

  function markDirty() {
    touched = true;

  /* ---------------------------------------------------------------- */

  function renderTabs() {
    ui.clear(tabBar);

      const btn = ui.el("button", {

  /* ---------------------------------------------------------------- */

  /** Fushë teksti e lidhur drejtpërdrejt me një çelës të draftit. */
  function textField(key, label, options = {}) {
    const control = options.multiline
      ? ui.textarea({ id: "f_" + key, rows: options.rows || 4, placeholder: options.placeholder || "" })
      : ui.input({
          id: "f_" + key, type: options.type || "text",
          placeholder: options.placeholder || "",
          inputmode: options.inputmode || null,
          min: options.min != null ? options.min : null,
          max: options.max != null ? options.max : null,
          step: options.step || null,
          list: options.list || null,
          maxlength: options.maxlength || null
        });

    control.value = draft[key] == null ? "" : draft[key];

    control.addEventListener("input", () => {
      if (options.type === "number") {
        const raw = control.value.trim();
        draft[key] = raw === "" ? null : (options.decimal ? fmt.parseNum(raw) : parseInt(raw, 10));
        if (Number.isNaN(draft[key])) draft[key] = null;
      } else {
        draft[key] = control.value;
      }
      markDirty();
      if (options.onInput) options.onInput(draft[key]);
      clearFieldError(key);

    return ui.field({
      label, id: "f_" + key, required: options.required, control,
      hint: options.hint, full: options.full, error: errors[key]

  }

  function selectField(key, label, options, config = {}) {
    const control = ui.select(

  function tabDetails() {

    const isLand = model.LAND_CATEGORIES.includes(draft.category);
    const grid = ui.el("div", { class: "form-grid form-grid--3" });

    grid.append(

      }),
      textField("plotSize", "Sipërfaqja e parcelës (m²)", { type: "number", decimal: true, min: 0 })
    );

    if (!isLand) {
      grid.append(

        textField("baths", "Banjo", { type: "number", min: 0 }),

      );
      grid.append(

      );
    } else {

   PRONAT
   =====================================================================

   Moduli më i përdorur i panelit: lista, kërkimi, filtrat, renditja dhe
   veprimet mbi një pronë.

   Dy pika që ndryshojnë nga versioni i mëparshëm:

   • Renditja e listës NUK përcakton më se cila pronë është e veçuar.
     «E veçuar» është fushë e vetën, me çelës të qartë.

   • Fshirja kalon nga një modal i vërtetë, jo nga `confirm()` i
     shfletuesit.
   ===================================================================== */

const PAGE_SIZE = 25;

/* Gjendja e pamjes — jeton sa është e hapur faqja, jo më gjatë. */
const view = {
  search: "",
  lifecycle: "",
  transactionType: "",
  category: "",
  city: "",
  featured: "",
  sort: "order",
  dir: "asc",
  page: 1,
  showFilters: false
};

/** Lejon që kartelat e panelit kryesor të hapin listën tashmë të filtruar. */
function applyPreset(preset) {
  Object.assign(view, {
    search: "", lifecycle: "", transactionType: "", category: "",
    city: "", featured: "", page: 1
  }, preset || {});
  if (preset && Object.keys(preset).length) view.showFilters = true;
}

/* ------------------------------------------------------------------ */
/* Filtrimi                                                            */
/* ------------------------------------------------------------------ */

function matches(p, query) {
  if (!query) return true;
  const q = query.toLowerCase();
  /* Kërkimi mbulon titullin, kodin, lokacionin dhe përshkrimin —
     pikërisht ato që administratori mban mend për një pronë. */
  return [
    p.title, p.code, model.composeLocation(p), p.city, p.neighborhood,
    p.address, p.summary, p.details
  ].some((f) => String(f || "").toLowerCase().includes(q));
}

function filtered() {
  const all = store.get().properties;

  let rows = all.filter((p) =>
    matches(p, view.search) &&
    (!view.lifecycle || p.lifecycle === view.lifecycle) &&
    (!view.transactionType || p.transactionType === view.transactionType) &&
    (!view.category || p.category === view.category) &&
    (!view.city || p.city === view.city) &&
    (view.featured === "" ||
      (view.featured === "yes" ? p.featured : !p.featured))
  );

  const dir = view.dir === "desc" ? -1 : 1;
  const by = {
    order: (a, b) => a._order - b._order,
    title: (a, b) => String(a.title).localeCompare(String(b.title), "sq"),
    code: (a, b) => String(a.code).localeCompare(String(b.code), "sq"),
    price: (a, b) => (a.priceValue ?? -1) - (b.priceValue ?? -1),
    size: (a, b) => (a.sizeValue ?? -1) - (b.sizeValue ?? -1),
    city: (a, b) => String(a.city).localeCompare(String(b.city), "sq"),
    updated: (a, b) => new Date(a.updatedAt || 0) - new Date(b.updatedAt || 0)
  }[view.sort] || ((a, b) => a._order - b._order);

  rows = rows.slice().sort((a, b) => by(a, b) * dir);
  return rows;
}

function hasActiveFilters() {
  return !!(view.lifecycle || view.transactionType || view.category || view.city || view.featured);
}

function clearFilters(rerender) {
  Object.assign(view, {
    lifecycle: "", transactionType: "", category: "", city: "", featured: "", page: 1
  });

}

  root.appendChild(ui.el("div", { class: "view__head" }, [
    ui.el("div", {}, [

      secondaryLabel: "Pastro filtrat",
      onSecondary: () => { view.search = ""; clearFilters(rerender); }

  }

  /* ---------- Lista ---------- */
  root.appendChild(
    store.get().ui.propertiesView === "grid"
      ? gridView(pageRows, rerender, rows.length, totalPages)

function pagination(totalRows, totalPages, rerender) {
  if (totalPages <= 1) return ui.el("div", { hidden: true });

  const from = (view.page - 1) * PAGE_SIZE + 1;
  const to = Math.min(view.page * PAGE_SIZE, totalRows);

  const pages = ui.el("div", { class: "pagination__pages" });

  const go = (n) => { view.page = n; rerender(); };

  pages.appendChild(ui.el("button", {
    class: "page-btn", type: "button", disabled: view.page === 1,
    "aria-label": "Faqja e mëparshme", onclick: () => go(view.page - 1)
  }, [ui.icon("chevronLeft", 14)]));

  /* Numrat rreth faqes aktuale, me pika kur ka boshllëk. */
  const window_ = new Set([1, totalPages, view.page, view.page - 1, view.page + 1]);
  let last = 0;
  for (let n = 1; n <= totalPages; n++) {
    if (!window_.has(n)) continue;
    if (n - last > 1) pages.appendChild(ui.el("span", { class: "muted text-xs", text: "…" }));
    pages.appendChild(ui.el("button", {
      class: "page-btn" + (n === view.page ? " is-active" : ""), type: "button",
      "aria-current": n === view.page ? "page" : null,
      onclick: () => go(n)
    }, [String(n)]));
    last = n;
  }

  pages.appendChild(ui.el("button", {
    class: "page-btn", type: "button", disabled: view.page === totalPages,
    "aria-label": "Faqja tjetër", onclick: () => go(view.page + 1)
  }, [ui.icon("chevronRight", 14)]));

  return ui.el("div", { class: "pagination" }, [
    ui.el("span", { class: "pagination__info", text: from + "–" + to + " nga " + totalRows }),
    pages
  ]);
}

          }, ["Hiq"])

  root.appendChild(list);
  return root;
}

const PAGE_SIZE = 25;

/* Veprimet që shkruan serveri, të përkthyera për njeriun. */
const ACTIONS = {
  publish_listings: { label: "Publikim", icon: "publish", tone: "success", module: "Pronat" },
  upload_image:     { label: "Ngarkim fotografie", icon: "image", tone: "info", module: "Media" },

};

const ROLE_LABEL = { admin: "Administrator", editor: "Redaktor" };

/** Përshkrimi njerëzor i një rreshti të regjistrit. */
function describeAction(entry) {
  const key = String(entry.action || "");
  const meta = ACTIONS[key] || { label: key || "Veprim", icon: "activity", tone: "muted", module: "—" };
  const detail = entry.detail || {};

  let text = meta.label;
  if (key === "publish_listings") {
    const count = detail.listingCount;
    text = "Publikimi u krye" + (count ? " — " + fmt.plural(count, "pronë", "prona") : "");
  } else if (key === "upload_image") {
    text = "Fotografia u ngarkua" + (detail.path ? " — " + String(detail.path).replace(/^images\//, "") : "");
  } else if (key === "set_role") {
    text = "Roli i përdoruesit u ndryshua" + (detail.role ? " në " + (ROLE_LABEL[detail.role] || detail.role) : "");
  } else if (key === "enable_user") {
    text = "Përdoruesi u aktivizua";
  } else if (key === "disable_user") {
    text = "Përdoruesi u çaktivizua";
  }

  return { ...meta, text };
}

/** Detajet teknike, të shfaqura vetëm kur ka diçka për të treguar. */
function detailSummary(entry) {
  const d = entry.detail || {};
  const bits = [];
  if (d.listingCount != null) bits.push(fmt.plural(d.listingCount, "pronë", "prona"));
  if (d.path) bits.push(String(d.path));
  if (d.branch) bits.push("dega " + d.branch);
  if (d.commit) bits.push("commit " + String(d.commit).slice(0, 7));
  if (d.role) bits.push("rol: " + (ROLE_LABEL[d.role] || d.role));
  return bits.join(" · ");
}

  }

  /* ---- Filtrat ---- */
  container.appendChild(filterBar(rerender));

  /* ---- Filtrimi ---- */
  const rows = applyFilters(cache);

  if (!cache.length) {
    container.appendChild(ui.emptyState({
      iconName: "activity",
      title: "Nuk ka aktivitet",
      text: "Asnjë veprim nuk është regjistruar ende."
    }));
    return root;
  }

  if (!rows.length) {
    container.appendChild(ui.emptyState({
      iconName: "search",
      title: "Nuk u gjet asnjë veprim",
      text: "Provoni të ndryshoni kërkimin ose filtrat.",
      secondaryLabel: "Pastro filtrat",
      onSecondary: () => {
        Object.assign(view, { search: "", user: "", action: "", from: "", to: "", page: 1 });
        rerender();
      }
    }));
    return root;
  }

  const totalPages = Math.max(1, Math.ceil(rows.length / PAGE_SIZE));
  if (view.page > totalPages) view.page = totalPages;
  const pageRows = rows.slice((view.page - 1) * PAGE_SIZE, view.page * PAGE_SIZE);

  container.appendChild(table(pageRows, rows.length, totalPages, rerender));
  return root;
}

/* ------------------------------------------------------------------ */
/* Filtrat                                                             */
/* ------------------------------------------------------------------ */

function applyFilters(entries) {
  const from = view.from ? new Date(view.from + "T00:00:00").getTime() : null;
  const to = view.to ? new Date(view.to + "T23:59:59").getTime() : null;
  const q = view.search.toLowerCase();

  return entries.filter((e) => {
    if (view.user && e.user_email !== view.user) return false;
    if (view.action && e.action !== view.action) return false;

    const t = new Date(e.created_at).getTime();
    if (from && t < from) return false;
    if (to && t > to) return false;

    if (q) {
      const haystack = [
        e.user_email, describeAction(e).text, detailSummary(e)
      ].join(" ").toLowerCase();
      if (!haystack.includes(q)) return false;
    }
    return true;
  });
}

function filterBar(rerender) {
  const users = [...new Set((cache || []).map((e) => e.user_email).filter(Boolean))].sort();
  const actions = [...new Set((cache || []).map((e) => e.action).filter(Boolean))].sort();

  const search = ui.searchField({
    placeholder: "Kërko në regjistër…",
    value: view.search,
    onInput: (v) => { view.search = v; view.page = 1; rerender(); }
  });

  const userSel = ui.select({ id: "flt_user" },
    [{ value: "", label: "Të gjithë" }, ...users.map((u) => ({ value: u, label: u }))], view.user);
  userSel.addEventListener("change", () => { view.user = userSel.value; view.page = 1; rerender(); });

  const actionSel = ui.select({ id: "flt_action" },
    [{ value: "", label: "Të gjitha" },
     ...actions.map((a) => ({ value: a, label: (ACTIONS[a] || {}).label || a }))], view.action);
  actionSel.addEventListener("change", () => { view.action = actionSel.value; view.page = 1; rerender(); });

  const fromInput = ui.input({ type: "date", id: "flt_from", value: view.from });
  fromInput.addEventListener("change", () => { view.from = fromInput.value; view.page = 1; rerender(); });

  const toInput = ui.input({ type: "date", id: "flt_to", value: view.to });
  toInput.addEventListener("change", () => { view.to = toInput.value; view.page = 1; rerender(); });

  return ui.el("div", {}, [
    ui.el("div", { class: "toolbar" }, [ui.el("div", { class: "toolbar__search" }, [search])]),
    ui.el("div", { class: "filters" }, [
      ui.field({ label: "Përdoruesi", id: "flt_user", control: userSel }),
      ui.field({ label: "Veprimi", id: "flt_action", control: actionSel }),
      ui.field({ label: "Prej datës", id: "flt_from", control: fromInput }),
      ui.field({ label: "Deri më", id: "flt_to", control: toInput })
    ])
  ]);
}

/* ------------------------------------------------------------------ */
/* Tabela                                                              */
/* ------------------------------------------------------------------ */

function table(rows, totalRows, totalPages, rerender) {
  const body = ui.el("tbody");

  for (const entry of rows) {
    const info = describeAction(entry);
    const detail = detailSummary(entry);

    body.appendChild(ui.el("tr", {}, [
      ui.el("td", { class: "td-shrink" }, [
        ui.el("div", { class: "feed__icon feed__icon--" + info.tone }, [ui.icon(info.icon)])
      ]),
      ui.el("td", {}, [
        ui.el("div", { class: "cell-title", text: entry.user_email || "sistemi" })
      ]),
      ui.el("td", {}, [
        ui.el("div", { class: "text-sm", text: info.text })
      ]),
      ui.el("td", { class: "col-l2" }, [ui.badge(info.module, "muted", { noDot: true })]),
      ui.el("td", { class: "td-num col-l3 muted" }, [
        ui.el("div", { text: fmt.dateTime(entry.created_at) }),
        ui.el("div", { class: "cell-sub", text: fmt.relative(entry.created_at) })
      ]),
      ui.el("td", { class: "col-l3" }, [
        ui.el("span", { class: "text-xs muted", text: detail || "—" })
      ])
    ]));
  }

  const head = ui.el("tr", {}, [
    ui.el("th", { scope: "col", class: "td-shrink" }, [""]),
    ui.el("th", { scope: "col" }, ["Përdoruesi"]),
    ui.el("th", { scope: "col" }, ["Veprimi"]),
    ui.el("th", { scope: "col", class: "col-l2" }, ["Moduli"]),
    ui.el("th", { scope: "col", class: "col-l3" }, ["Koha"]),
    ui.el("th", { scope: "col", class: "col-l3" }, ["Detajet"])
  ]);

  const wrap = ui.el("div", { class: "table-wrap responsive" }, [
    ui.el("div", { class: "table-scroll" }, [
      ui.el("table", { class: "table" }, [ui.el("thead", {}, [head]), body])
    ])
  ]);

  /* Kartelat për telefon */
  const cards = ui.el("div", { class: "rowcards" });
  for (const entry of rows) {
    const info = describeAction(entry);
    cards.appendChild(ui.el("div", { class: "rowcard" }, [
      ui.el("div", { class: "rowcard__top" }, [
        ui.el("div", { class: "feed__icon feed__icon--" + info.tone }, [ui.icon(info.icon)]),
        ui.el("div", { class: "rowcard__body" }, [
          ui.el("div", { class: "rowcard__title", text: info.text }),
          ui.el("div", { class: "rowcard__meta", text: entry.user_email || "sistemi" }),
          ui.el("div", { class: "rowcard__meta", text: fmt.dateTime(entry.created_at) })
        ])
      ])
    ]));
  }
  wrap.appendChild(cards);

  /* Faqosja */
  if (totalPages > 1) {
    const from = (view.page - 1) * PAGE_SIZE + 1;
    const to = Math.min(view.page * PAGE_SIZE, totalRows);
    const pages = ui.el("div", { class: "pagination__pages" }, [
      ui.el("button", {
        class: "page-btn", type: "button", disabled: view.page === 1,
        "aria-label": "Faqja e mëparshme",
        onclick: () => { view.page--; rerender(); }
      }, [ui.icon("chevronLeft", 14)]),
      ui.el("span", { class: "pagination__info", text: view.page + " / " + totalPages }),
      ui.el("button", {
        class: "page-btn", type: "button", disabled: view.page === totalPages,
        "aria-label": "Faqja tjetër",
        onclick: () => { view.page++; rerender(); }
      }, [ui.icon("chevronRight", 14)])
    ]);

    wrap.appendChild(ui.el("div", { class: "pagination" }, [
      ui.el("span", { class: "pagination__info", text: from + "–" + to + " nga " + totalRows }),
      pages
    ]));
  }

  return wrap;
}

/* ------------------------------------------------------------------ */
/* Publikimi i fundit — lexohet nga regjistri për panelin kryesor      */
/* ------------------------------------------------------------------ */

async function fetchLastPublish(api) {
  try {
    const res = await api.getActivityLog(50);
    const entries = (res && res.entries) || [];
    const hit = entries.find((e) => e.action === "publish_listings");
    if (!hit) return null;
    return {
      at: hit.created_at,
      email: hit.user_email,
      count: (hit.detail || {}).listingCount || null
    };
  } catch (_) {
    /* Redaktorët nuk kanë leje për regjistrin. Kjo nuk është gabim —
       thjesht nuk ka informacion për të shfaqur. */
    return null;
  }
}

  return { describeAction, invalidate, render, fetchLastPublish };
})();

    context.api.listUsers()
      .then((res) => { cache = (res && res.users) || []; })
      .catch((e) => { loadError = e.message || "Lista e përdoruesve nuk u ngarkua dot."; cache = []; })
      .finally(() => { loading = false; rerender(); });
  }

  if (loading || cache === null) {
    const table = ui.el("table", { class: "table" }, [ui.el("tbody")]);
    ui.$("tbody", table).appendChild(ui.skeletonRows(5, 5));
    container.appendChild(ui.el("div", { class: "table-wrap" }, [
      ui.el("div", { class: "table-scroll" }, [table])
    ]));
    return root;
  }

  if (loadError) {
    container.appendChild(ui.el("div", { class: "callout callout--error" }, [
      ui.icon("alert"), ui.el("div", { text: loadError })
    ]));
    return root;
  }

  container.appendChild(toolbar(rerender));

  const rows = applyFilters(cache);

  if (!rows.length) {
    container.appendChild(ui.emptyState({
      iconName: "users",
      title: cache.length ? "Nuk u gjet asnjë përdorues" : "Nuk ka përdorues",
      text: cache.length
        ? "Provoni të ndryshoni kërkimin ose filtrat."
        : "Përdoruesit shtohen nga paneli i Supabase-it.",
      secondaryLabel: cache.length ? "Pastro filtrat" : null,
      onSecondary: () => { Object.assign(view, { search: "", role: "", status: "" }); rerender(); }
    }));
    return root;
  }

  container.appendChild(table(rows, context, rerender));
  return root;
}

function applyFilters(users) {
  const q = view.search.toLowerCase();
  return users.filter((u) => {
    if (view.role && String(u.role || "").toLowerCase() !== view.role) return false;
    if (view.status === "active" && u.active === false) return false;
    if (view.status === "inactive" && u.active !== false) return false;
    if (q) {
      const haystack = [u.email, u.full_name].join(" ").toLowerCase();
      if (!haystack.includes(q)) return false;
    }
    return true;
  });
}

function toolbar(rerender) {
  const search = ui.searchField({
    placeholder: "Kërko sipas emrit ose email-it…",
    value: view.search,
    onInput: (v) => { view.search = v; rerender(); }
  });

  const roleSel = ui.select({ id: "flt_role" },
    [{ value: "", label: "Të gjitha rolet" }, ...ROLES.map((r) => ({ value: r.value, label: r.label }))],
    view.role);
  roleSel.addEventListener("change", () => { view.role = roleSel.value; rerender(); });

  const statusSel = ui.select({ id: "flt_status" }, [
    { value: "", label: "Të gjitha statuset" },
    { value: "active", label: "Aktiv" },
    { value: "inactive", label: "Joaktiv" }
  ], view.status);
  statusSel.addEventListener("change", () => { view.status = statusSel.value; rerender(); });

  return ui.el("div", { class: "toolbar" }, [
    ui.el("div", { class: "toolbar__search" }, [search]),
    roleSel, statusSel
  ]);
}

          : ui.dropdown(

              }, [ui.icon("more")]),

  const head = ui.el("tr", {}, [

  /* Kartelat për telefon */

    cards.appendChild(ui.el("div", { class: "rowcard" }, [

/* Ndryshimi i rolit                                                   */
/* ------------------------------------------------------------------ */

function changeRole(user, context, rerender) {
  const current = String(user.role || "").toLowerCase();
  let chosen = current;

  const options = ui.el("div", { class: "stack stack--sm" });
  const inputs = [];

  for (const role of ROLES) {
    const radio = ui.el("input", {
      type: "radio", name: "role", value: role.value,
      checked: role.value === current
    });
    radio.addEventListener("change", () => { chosen = role.value; });
    inputs.push(radio);

    options.appendChild(ui.el("label", {
      class: "check", style: "padding:var(--sp-3);border:1px solid var(--border);border-radius:var(--r-md)"
    }, [
      radio,
      ui.el("span", { class: "check__box", style: "border-radius:50%" }),
      ui.el("span", {}, [
        ui.el("div", { text: role.label }),
        ui.el("small", { class: "muted text-xs", text: role.hint })
      ])
    ]));
  }

  const saveBtn = ui.el("button", { class: "btn btn--primary", type: "button" }, ["Ruaj Ndryshimet"]);
  const cancelBtn = ui.el("button", { class: "btn btn--ghost", type: "button" }, ["Anulo"]);

  const modal = ui.openModal({
    title: "Ndrysho rolin",
    subtitle: user.email,
    body: ui.el("div", {}, [options]),
    footer: ui.el("div", { class: "row row--end row--tight", style: "width:100%" }, [cancelBtn, saveBtn])
  });

  cancelBtn.addEventListener("click", () => modal.close());

  saveBtn.addEventListener("click", async () => {
    if (chosen === current) { modal.close(); return; }

    ui.setBusy(saveBtn, true, "Duke ruajtur…");
    try {
      await context.api.setUserRole(user.id, chosen);
      user.role = chosen;
      ui.toast("Roli u ndryshua me sukses.", { text: user.email + " → " + roleLabel(chosen) });
      invalidateActivity();
      modal.close();
      rerender();
    } catch (e) {
      ui.setBusy(saveBtn, false);
      ui.toast("Roli nuk u ndryshua.", { type: "error", text: e.message });
    }
  });
}

/* ------------------------------------------------------------------ */
/* Aktivizimi / çaktivizimi                                            */
/* ------------------------------------------------------------------ */

async function setActive(user, active, context, rerender) {
  const ok = await ui.confirmDialog({
    title: active ? "Aktivizo përdoruesin?" : "Çaktivizo përdoruesin?",
    message: active
      ? "<b>" + ui.esc(user.email) + "</b> do të mund të kyçet përsëri në panel."
      : "<b>" + ui.esc(user.email) + "</b> nuk do të mund të hyjë në panel derisa të aktivizohet përsëri.",
    confirmLabel: active ? "Aktivizo" : "Çaktivizo",
    cancelLabel: "Anulo",
    danger: !active,
    tone: active ? "info" : "danger"
  });
  if (!ok) return;

  try {
    await context.api.setUserActive(user.id, active);
    user.active = active;
    ui.toast(active ? "Përdoruesi u aktivizua." : "Përdoruesi u çaktivizua.");
    invalidateActivity();
    rerender();
  } catch (e) {
    ui.toast("Statusi nuk u ndryshua.", { type: "error", text: e.message });
  }
}

  return { invalidate, render };
})();

const __publishing = (function () {
  const ui = __ui;
  const model = __model;
  const store = __store;
  const fmt = __fmt;
  const invalidateActivity = __activity.invalidate;
/* =====================================================================
   PUBLIKIMI
   =====================================================================

   Rruga e publikimit mbetet ajo ekzistuese dhe e sigurt:

     shfletuesi → Supabase JWT → funksioni zone-admin → GitHub API

   Tokeni i GitHub-it nuk kalon kurrë nga shfletuesi.

   Përmirësimet janë në rrjedhë dhe në qartësi:

   • Konflikti kapet PARA se të ngarkohet asnjë fotografi. Më parë,
     dikush mund të priste ngarkimin e dhjetë fotove dhe pastaj të
     mësonte se dikush tjetër kishte publikuar ndërkohë.

   • Fotot dërgohen para listings.js. Nëse një foto dështon, skedari i
     pronave nuk dërgohet fare — kështu faqja nuk mbetet kurrë duke
     treguar një foto që nuk ekziston.

   • Çdo hap ka gjendjen e vet. Kur diçka dështon, duket saktësisht se
     ku dështoi.
   ===================================================================== */

const STEP_IDS = ["version", "prepare", "images", "listings", "done"];

/**
 * Hap dritaren e publikimit.
 * @param {object} context  { api, refresh, openSite }
 */
function openPublishDialog(context) {
  const state = store.get();

  if (!store.canPublish()) {
    ui.toast("Nuk keni leje për të publikuar.", {
      type: "warning",
      text: "Roli juaj nuk e lejon dërgimin e ndryshimeve. Kontaktoni një administrator."
    });
    return;
  }

  const changes = store.changeSummary();
  if (!changes.total && !changes.images) {
    ui.toast("Nuk ka çfarë të publikohet.", {
      type: "info",
      text: "Të gjitha ndryshimet janë tashmë në uebfaqe."
    });
    return;
  }

  /* ---------------------------------------------------------------- */
  /* Struktura                                                        */
  /* ---------------------------------------------------------------- */

  const summary = buildSummary(changes, state);
  const stepsBox = ui.el("div", { class: "publish-steps", hidden: true, "aria-live": "polite" });
  const bodyBox = ui.el("div", {}, [summary, stepsBox]);

  const publishBtn = ui.el("button", { class: "btn btn--primary", type: "button" },
    [ui.icon("publish"), "Publiko Ndryshimet"]);
  const cancelBtn = ui.el("button", { class: "btn btn--ghost", type: "button" }, ["Anulo"]);
  const footer = ui.el("div", { class: "row row--end row--tight", style: "width:100%" },
    [cancelBtn, publishBtn]);

  const modal = ui.openModal({
    title: "Publiko Ndryshimet",
    subtitle: "Ndryshimet dalin në uebfaqe brenda një deri dy minutash.",
    size: "wide",
    closeOnBackdrop: false,
    body: bodyBox,
    footer
  });

  cancelBtn.addEventListener("click", () => modal.close());

  /* ---------------------------------------------------------------- */
  /* Hapat                                                            */
  /* ---------------------------------------------------------------- */

  const stepNodes = {};

  function buildSteps(imageCount) {
    ui.clear(stepsBox);
    stepsBox.hidden = false;
    summary.hidden = true;

    const labels = {
      version: "Duke kontrolluar versionin…",
      prepare: "Duke përgatitur fotografitë…",
      images: imageCount
        ? "Duke ngarkuar " + fmt.plural(imageCount, "fotografi", "fotografi") + "…"
        : "Nuk ka fotografi të reja",
      listings: "Duke përditësuar pronat…",
      done: "Publikimi përfundoi me sukses."
    };

    for (const id of STEP_IDS) {
      const mark = ui.el("div", { class: "pstep__mark" });
      const detail = ui.el("div", { class: "pstep__detail" });
      const node = ui.el("div", { class: "pstep" }, [
        mark,
        ui.el("div", { class: "pstep__body" }, [
          ui.el("div", { text: labels[id] }),
          detail
        ])
      ]);
      stepNodes[id] = { node, mark, detail };
      stepsBox.appendChild(node);
    }
  }

  function setStep(id, status, detail) {
    const step = stepNodes[id];
    if (!step) return;

    step.node.classList.remove("is-active", "is-done", "is-failed");
    if (status) step.node.classList.add("is-" + status);

    ui.clear(step.mark);
    if (status === "done") step.mark.appendChild(ui.icon("check", 11));
    else if (status === "failed") step.mark.appendChild(ui.icon("close", 11));
    else if (status === "active") step.mark.appendChild(ui.el("span", { class: "spinner", style: "width:11px;height:11px" }));

    if (detail !== undefined) step.detail.textContent = detail || "";
  }

  /* ---------------------------------------------------------------- */
  /* Rrjedha                                                          */
  /* ---------------------------------------------------------------- */

  publishBtn.addEventListener("click", async () => {
    const s = store.get();
    const pendingNames = Object.keys(s.pendingImages);

    buildSteps(pendingNames.length);
    ui.setBusy(publishBtn, true, "Duke publikuar…");
    cancelBtn.disabled = true;

    try {
      /* --- 1. Versioni ------------------------------------------- */
      setStep("version", "active");
      const remote = await context.api.getListings();

      if (s.repo.sha && remote.sha && remote.sha !== s.repo.sha) {
        setStep("version", "failed", "Versioni në depo ka ndryshuar.");
        ui.setBusy(publishBtn, false);
        cancelBtn.disabled = false;
        modal.close();
        showConflictDialog(context, remote);
        return;
      }
      setStep("version", "done", "Dega " + (remote.branch || s.repo.branch || "—"));

      /* --- 2. Përgatitja ----------------------------------------- */
      setStep("prepare", "active");
      store.prunePendingImages();

      const code = model.buildListingsFile(s.site, s.properties);

      /* Asnjë skedar i prishur nuk niset kurrë drejt faqes live. */
      model.verifyGenerated(code, s.properties.length);

      const names = Object.keys(store.get().pendingImages);
      setStep("prepare", "done",
        names.length ? fmt.plural(names.length, "fotografi gati", "fotografi gati") : "Asnjë fotografi e re");

      /* --- 3. Fotografitë ---------------------------------------- */
      if (names.length) {
        setStep("images", "active", "0 / " + names.length);
        let uploaded = 0;

        for (const name of names) {
          const image = store.get().pendingImages[name];
          if (!image) continue;

          try {
            const b64 = await ui.blobToB64(image.blob);
            await context.api.uploadImage({ name, contentBase64: b64 });
          } catch (e) {
            setStep("images", "failed", "Dështoi te «" + name + "» — " + e.message);
            throw new PublishStopped(
              "Ngarkimi i fotografive dështoi.",
              "Pronat nuk u dërguan, prandaj uebfaqja mbeti e paprekur. Provoni përsëri."
            );
          }

          /* Hiqet nga radha vetëm pas suksesit: një provë e dytë e
             vazhdon aty ku mbeti, pa i ridërguar fotot e kryera. */
          store.removePendingImage(name);
          uploaded++;
          setStep("images", "active", uploaded + " / " + names.length);
        }
        setStep("images", "done", fmt.plural(uploaded, "fotografi u ngarkua", "fotografi u ngarkuan"));
      } else {
        setStep("images", "done");
      }

      /* --- 4. Pronat --------------------------------------------- */
      setStep("listings", "active");
      let result;
      try {
        result = await context.api.publishListings({
          content: code,
          baseSha: store.get().repo.sha,
          listingCount: s.properties.length
        });
      } catch (e) {
        if (e.isConflict) {
          setStep("listings", "failed", "Dikush tjetër publikoi ndërkohë.");
          ui.setBusy(publishBtn, false);
          cancelBtn.disabled = false;
          modal.close();
          showConflictDialog(context);
          return;
        }
        setStep("listings", "failed", e.message);
        throw new PublishStopped("Pronat nuk u dërguan.", e.message);
      }

      store.get().repo.sha = result.sha;
      setStep("listings", "done", fmt.plural(s.properties.length, "pronë u dërgua", "prona u dërguan"));

      /* --- 5. Përfundimi ----------------------------------------- */
      const now = new Date().toISOString();
      for (const p of store.get().properties) {
        if (model.lifecycleIsPublic(p.lifecycle) && !p.publishedAt) p.publishedAt = now;
      }

      store.markPublished();
      store.get().lastPublish = {
        at: now,
        email: (store.get().me || {}).email || "",
        count: s.properties.length
      };
      invalidateActivity();

      setStep("done", "done", "Uebfaqja përditësohet brenda një deri dy minutash.");
      ui.setBusy(publishBtn, false);

      publishBtn.replaceChildren(ui.icon("external"), document.createTextNode("Shiko Uebfaqen"));
      publishBtn.onclick = () => context.openSite();
      cancelBtn.disabled = false;
      cancelBtn.textContent = "Mbyll";

      ui.toast("Prona u publikuan me sukses.", {
        text: fmt.plural(s.properties.length, "pronë është live", "prona janë live") + "."
      });
      context.refresh();

    } catch (e) {
      ui.setBusy(publishBtn, false);
      cancelBtn.disabled = false;

      if (e instanceof PublishStopped) {
        ui.toast(e.message, { type: "error", text: e.detail });
      } else {
        setStep("listings", "failed", e.message);
        ui.toast("Publikimi dështoi.", {
          type: "error",
          text: e.message || "Ndodhi një gabim gjatë publikimit. Provoni përsëri."
        });
      }
      context.refresh();
    }
  });

  return modal;
}

class PublishStopped extends Error {
  constructor(message, detail) {
    super(message);
    this.detail = detail;
  }
}

function buildSummary(changes, state) {
  const rows = [];
  if (changes.added) rows.push(["Prona të reja", changes.added]);
  if (changes.edited) rows.push(["Prona të ndryshuara", changes.edited]);
  if (changes.removed) rows.push(["Prona të fshira", changes.removed]);
  if (changes.images) rows.push(["Fotografi të reja", changes.images]);
  if (changes.site) rows.push(["Cilësimet e faqes", "u ndryshuan"]);

  const list = ui.el("div", { class: "stack stack--sm" });
  for (const [label, value] of rows) {
    list.appendChild(ui.el("div", { class: "row", style: "justify-content:space-between" }, [
      ui.el("span", { class: "text-sm secondary-text", text: label }),
      ui.el("span", { class: "mono text-sm", text: typeof value === "number" ? fmt.num(value) : value })
    ]));
  }

  const draftCount = state.properties.filter((p) => !model.lifecycleIsPublic(p.lifecycle)).length;

  return ui.el("div", {}, [
    ui.el("div", { class: "card mb-4" }, [
      ui.el("div", { class: "card__head" }, [
        ui.el("h3", { class: "card__title", text: "Çfarë do të publikohet" })
      ]),
      ui.el("div", { class: "card__body" }, [list])
    ]),

    ui.el("div", { class: "stack stack--sm" }, [
      ui.el("div", { class: "callout" }, [
        ui.icon("info"),
        ui.el("div", {
          html: "Gjithsej <b>" + fmt.plural(state.properties.length, "pronë", "prona") + "</b> do të shkruhen te " +
                "<code>listings.js</code>" +
                (draftCount
                  ? ", nga të cilat <b>" + draftCount + "</b> nuk do të shfaqen publikisht."
                  : ".")
        })
      ]),
      ui.el("div", { class: "callout callout--info" }, [
        ui.icon("key"),
        ui.el("div", {
          html: "Publikimi kalon nga serveri i sigurt. Tokeni i GitHub-it nuk ndodhet asnjëherë në shfletues."
        })
      ])
    ])
  ]);
}

function setLoginBusy(busy) {
  const btn = $("btnLogin");
  ui.setBusy(btn, busy, busy ? "Duke u kyçur…" : null);
  $("email").disabled = busy;
  $("password").disabled = busy;
}

$("loginForm").addEventListener("submit", async (e) => {
  e.preventDefault();
  if (flow.signingIn) return;

  const email = $("email").value.trim();
  const password = $("password").value;

  if (!email || !password) {
    authMsg("loginMsg", "Plotësoni email-in dhe fjalëkalimin.", "error");
    return;
  }
  if (!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(email)) {
    authMsg("loginMsg", "Adresa e email-it nuk duket e saktë.", "error");
    return;
  }

  flow.signingIn = true;
  setLoginBusy(true);
  authMsg("loginMsg", "");

  let result;
  try {
    result = await withTimeout(supabase.auth.signInWithPassword({ email, password }), 25000);
  } catch (err) {
    flow.signingIn = false;
    setLoginBusy(false);
    authMsg("loginMsg", authMessage(err, MSG.server), "error");
    return;
  }

  const error = result && result.error;
  const session = result && result.data && result.data.session;

  if (error) {
    flow.signingIn = false;
    setLoginBusy(false);
    authMsg("loginMsg", authMessage(error, MSG.generic), "error");
    $("password").value = "";
    $("password").focus();
    return;
  }

  /* Supabase mund të kthejë përdorues pa sesion (p.sh. email i
     pakonfirmuar). Pa këtë kontroll, faqja «kyçej» dhe pastaj ngecte. */
  if (!session) {
    flow.signingIn = false;
    setLoginBusy(false);
    authMsg("loginMsg", MSG.notConfirmed, "error");
    $("password").value = "";
    return;
  }

  $("password").value = "";
  try {
    await enterPanel();
  } finally {
    flow.signingIn = false;
    setLoginBusy(false);
  }
});

  if (!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(email)) {
    authMsg("forgotMsg", "Adresa e email-it nuk duket e saktë.", "error");
    return;
  }

  const redirectTo = resetRedirectUrl();
  if (!redirectTo) {
    authMsg("forgotMsg", "Faqja duhet hapur nga interneti, jo si skedar lokal.", "error");
    return;
  }

  flow.forgotBusy = true;
  const btn = $("btnForgot");
  ui.setBusy(btn, true, "Duke dërguar…");
  $("forgotEmail").disabled = true;
  authMsg("forgotMsg", "");

  try {

    /* Mesazhi i suksesit shfaqet VETËM kur Supabase e pranoi vërtet
       kërkesën. Ndryshe njerëzit presin një email që s'u nis kurrë. */
    if (error) {

    /* Formulimi mbetet neutral: nuk zbulojmë nëse adresa ekziston. */
    authMsg("forgotMsg", "Nëse adresa ekziston, linku u dërgua.", "success");

async function enterPanelInner() {
  showScreen("screen-boot");
  $("bootText").textContent = "Duke verifikuar lejet…";

  let profile;
  try {
    const res = await api.getProfile();
    profile = res && res.profile;
    if (!profile) throw new Error(MSG.server);
  } catch (e) {
    /* 401 dhe 403-shet e panelit i kanë shfaqur tashmë ekranet e veta. */
    if (e.status === 401) return;
    if (e.status === 403 && PANEL_DENY_CODES.includes(e.code)) return;

    /* Gjithçka tjetër — rrjet, server, kohë e mbaruar — nuk është faji i
       përdoruesit. Kthehet te hyrja me një mesazh të kuptueshëm. */
    store.reset();
    showScreen("screen-login");
    authMsg("loginMsg", e.message || MSG.server, "error");
    return;
  }

  const me = { ...profile, role: normRole(profile.role) };

  if (!isActive(me)) {
    showDenied("Përdorues joaktiv. Kontaktoni administratorin.");
    return;
  }
  if (!["admin", "editor"].includes(me.role)) {
    showDenied("Roli juaj nuk lejon qasje në këtë panel.");
    return;
  }

  store.setProfile(me);
  store.loadPrefs();

  buildShell();
  showScreen(null);

  if (!storageIsPersistent()) {
    ui.toast("Sesioni nuk po ruhet.", {
      type: "warning",
      text: "Shfletuesi po bllokon ruajtjen. Do të dilni kur ta mbyllni skedën."
    });

  await loadData();
}

  if (route === "property-new") {
    currentRoute = "properties";
    properties.applyPreset({});

    updateNav();
    return;

  if (!ROUTES[route]) route = "dashboard";

  currentRoute = route;

/* ---------------- Sidebar ---------------- */

function buildSidebar() {
  const nav = ui.clear($("sidebarNav"));

  for (const group of NAV_GROUPS) {
    const items = group.items.filter((item) => !item.adminOnly || store.isAdmin());
    if (!items.length) continue;

    const box = ui.el("div", { class: "nav__group" }, [
      ui.el("div", { class: "nav__label", text: group.label })
    ]);

    for (const item of items) {
      const btn = ui.el("button", {
        class: "nav__item",
        type: "button",
        dataset: { route: item.route },
        "data-tip": item.label,
        onclick: () => navigate(item.route)
      }, [
        ui.el("span", { class: "nav__icon" }, [ui.icon(item.icon)]),
        ui.el("span", { class: "nav__text", text: item.label }),
        item.count ? ui.el("span", { class: "nav__count", dataset: { count: item.route } }) : null
      ]);
      box.appendChild(btn);
    }

    nav.appendChild(box);
  }
}

function updateNav() {
  for (const btn of ui.$$(".nav__item", $("sidebarNav"))) {
    const route = btn.dataset.route;
    const active = route === currentRoute;
    btn.classList.toggle("is-active", active);
    if (active) btn.setAttribute("aria-current", "page");
    else btn.removeAttribute("aria-current");
  }

  /* Numëruesit rifreskohen me çdo ndryshim gjendjeje. */
  for (const group of NAV_GROUPS) {
    for (const item of group.items) {
      if (!item.count) continue;
      const node = ui.$('[data-count="' + item.route + '"]', $("sidebarNav"));
      if (node) node.textContent = fmt.num(item.count());
    }
  }

  const route = ROUTES[currentRoute] || ROUTES.dashboard;
  $("headerTitle").textContent = route.title;
  ui.clear($("breadcrumbs")).append(
    ui.el("span", { text: route.group }),
    ui.el("span", { class: "breadcrumbs__sep", text: "/" }),
    ui.el("span", { text: route.title })
  );
}

/* Sirtari në telefon */
let scrim = null;

function openDrawer() {
  $("sidebar").classList.add("is-open");
  $("burger").setAttribute("aria-expanded", "true");
  scrim = ui.el("div", { class: "drawer-scrim", onclick: closeDrawer });
  document.body.appendChild(scrim);
}

function closeDrawer() {
  $("sidebar").classList.remove("is-open");
  $("burger").setAttribute("aria-expanded", "false");
  if (scrim) { scrim.remove(); scrim = null; }
}

/* ---------------- Header ---------------- */

function buildHeader() {
  /* Kërkimi global: çon te lista e pronave me pyetjen e shkruar. */
  const search = ui.searchField({
    placeholder: "Kërko pronë sipas titullit, kodit ose lokacionit…",
    onInput: (value) => {
      if (!value) return;
      properties.applyPreset({ search: value });
      if (currentRoute !== "properties") navigate("properties", { search: value });
      else renderView();
    }
  });
  ui.clear($("headerSearch")).appendChild(search);

  /* Treguesi i ndryshimeve të papublikuara — elementi që i thotë
     administratorit, pa e pyetur askënd, nëse puna e tij ka dalë live. */
  $("pubState").addEventListener("click", () => {
    if (store.isDirty()) openPublishDialog(context);
    else navigate("dashboard");
  });

  /* Veprimet e shpejta */
  const quickActions = [
    { label: "Shto Pronë", icon: "plus", onClick: () => navigate("property-new") },
    { label: "Publiko Ndryshimet", icon: "publish", onClick: () => openPublishDialog(context), needsPublish: true },
    { separator: true },
    { label: "Shiko Uebfaqen", icon: "external", onClick: openSite },
    { label: "Ringarko të dhënat", icon: "refresh", onClick: reloadData }
  ].filter((a) => !a.needsPublish || store.canPublish());

  const quickBtn = ui.el("button", {
    class: "btn btn--secondary btn--icon", type: "button", "aria-label": "Veprime të shpejta"
  }, [ui.icon("plus")]);
  ui.clear($("headerQuick")).appendChild(ui.dropdown(quickBtn, quickActions));

  /* Profili */
  const me = store.get().me;
  const label = me.full_name || me.email;

  const profileBtn = ui.el("button", { class: "profile-btn", type: "button" }, [
    ui.el("span", { class: "avatar", text: fmt.initials(label) }),
    ui.el("span", { class: "profile-btn__meta" }, [
      ui.el("span", { class: "profile-btn__name", text: label }),
      ui.el("span", { class: "profile-btn__role", text: ROLE_LABEL[me.role] || me.role })
    ]),
    ui.icon("chevronDown", 14)
  ]);

  const profileMenu = ui.dropdown(profileBtn, [
    {
      head: ui.el("div", { class: "menu__head" }, [
        ui.el("div", { class: "menu__head-name", text: me.email }),
        ui.el("div", {
          class: "menu__head-role",
          text: (ROLE_LABEL[me.role] || me.role) + " · " + (store.canPublish() ? "mund të publikojë" : "pa leje publikimi")
        })
      ])
    },
    { label: "Cilësimet", icon: "settings", onClick: () => navigate("settings") },
    { label: "Shiko Uebfaqen", icon: "external", onClick: openSite },
    { separator: true },
    { label: "Dil", icon: "logout", danger: true, onClick: doLogout }
  ]);

  ui.clear($("headerProfile")).appendChild(profileMenu);
}

function updatePublishState() {
  const node = $("pubState");
  const changes = store.changeSummary();
  const dirty = changes.total > 0 || changes.images > 0;
  const count = changes.total + changes.images;

  node.classList.toggle("is-dirty", dirty);
  node.hidden = !store.get().loaded;

  ui.clear(node).append(
    ui.el("span", { class: "pub-state__dot" }),
    dirty
      ? ui.el("span", {}, [
          ui.el("span", { class: "pub-state__num", text: fmt.num(count) }),
          document.createTextNode(" " + (count === 1 ? "ndryshim i papublikuar" : "ndryshime të papublikuara"))
        ])
      : ui.el("span", { text: "Të gjitha ndryshimet janë publikuar" })
  );

  node.setAttribute("title", dirty
    ? "Klikoni për të publikuar ndryshimet"
    : "Uebfaqja përputhet me atë që keni këtu");
}

/* ==================================================================
   Vizatimi
   ================================================================== */

function renderView() {
  const main = ui.clear($("viewRoot"));
  const state = store.get();

  if (state.loading && !state.loaded) {
    main.appendChild(ui.el("div", { class: "view" }, [
      ui.el("div", { class: "stat-grid mb-4" }, [ui.skeletonCards(8)]),
      ui.el("div", { class: "skeleton skeleton--card", style: "height:220px" })
    ]));
    return;
  }

  if (state.loadError && !state.loaded) {
    main.appendChild(ui.el("div", { class: "view" }, [
      ui.emptyState({
        iconName: "alert",
        title: "Të dhënat nuk u ngarkuan",
        text: state.loadError,
        actionLabel: null,
        secondaryLabel: "Provo përsëri",
        onSecondary: () => loadData()
      })
    ]));
    return;
  }

  const route = ROUTES[currentRoute] || ROUTES.dashboard;
  main.appendChild(route.render(context));
}

/** Rivizaton pamjen aktuale dhe pjesët e përbashkëta të shtresës. */
function refresh() {
  if (!shellBuilt) return;
  renderView();
  updateNav();
  updatePublishState();
}

store.subscribe(() => {
  if (!shellBuilt) return;
  updateNav();
  updatePublishState();
});

/* ==================================================================
   Mbrojtja nga humbja e punës
   ================================================================== */

window.addEventListener("beforeunload", (e) => {
  if (store.isDirty()) { e.preventDefault(); e.returnValue = ""; }
});

/* ==================================================================
   Sesioni
   ==================================================================

   RREGULL: brenda onAuthStateChange nuk thirret KURRË një funksion
   tjetër i Supabase-it me await. Supabase mban një bllokim të
   brendshëm ndërsa njofton dëgjuesit; nëse brenda tij kërkohet
   getSession(), të dyja presin njëra-tjetrën përgjithmonë. Kjo ishte
   arsyeja kryesore pse kyçja «ngecte» herë pas here me kredenciale
   krejtësisht të sakta. Puna e vërtetë shtyhet me setTimeout(…, 0).
   ================================================================== */

const defer = (fn) => setTimeout(fn, 0);

supabase.auth.onAuthStateChange((event, session) => {
  if (event === "SIGNED_OUT" || (!session && event !== "INITIAL_SESSION")) {
    if (store.get().me || store.get().loaded) {
      store.reset();
      defer(() => {
        showScreen("screen-login");
        authMsg("loginMsg", "Dolët nga llogaria.", "info");
      });
    }
    return;
  }

  /* Tokeni u rinovua vetë — sesioni vazhdon, s'ka çfarë të bëhet. */
  if (event === "TOKEN_REFRESHED") return;

  /* Kyçje nga një skedë tjetër, ose rikthim i sesionit. Kur kyçja bëhet
     nga vetë ky formular, e trajton formulari — që të mos hyjmë dy herë. */
  if (event === "SIGNED_IN" && session && !store.get().me && !flow.signingIn && flow.bootDone) {
    defer(() => enterPanel());
  }
});

/* Rrjeta e sigurisë: kap një sesion që ka rënë pa lajmëruar. Askush nuk
   nxirret jashtë vetëm sepse interneti u ndërpre për pak sekonda. */
setInterval(async () => {
  if (!store.get().me || flow.expiring || document.hidden) return;
  const { session, offline } = await getSessionSafe(supabase, 20000);
  if (offline) return;
  if (!session) await handleExpired();
}, 60000);

window.addEventListener("online", async () => {
  if (!store.get().me || flow.expiring) return;
  const { session, offline } = await getSessionSafe(supabase, 20000);
  if (!offline && !session) await handleExpired();
});

/* ==================================================================
   Nisja
   ================================================================== */

(async function boot() {
  showScreen("screen-boot");

  /* Mesazhet që vijnë nga faqja e rivendosjes së fjalëkalimit. */
  const query = new URLSearchParams(location.search);
  const justReset = query.get("reset") === "1";
  const openForgot = query.get("forgot") === "1";
  if (justReset || openForgot) {
    try { history.replaceState(null, "", location.pathname); } catch (_) {}
  }

  function toLogin(text, tone) {
    showScreen(openForgot ? "screen-forgot" : "screen-login");
    if (text) authMsg(openForgot ? "forgotMsg" : "loginMsg", text, tone);
    $(openForgot ? "forgotEmail" : "email").focus();
  }

  const { session, offline, error } = await getSessionSafe(supabase, 15000);
  flow.bootDone = true;

  if (justReset) {
    /* Fjalëkalimi sapo u ndryshua: gjithmonë kërkohet kyçje e re. */
    if (session) await signOutSafe(supabase, "local");
    toLogin(MSG.changed, "success");
    return;
  }

  if (offline) {
    toLogin(authMessage(error, MSG.network), "error");
    return;
  }

  if (session) await enterPanel();
  else toLogin("");
})();

  return {  };
})();

</script>
