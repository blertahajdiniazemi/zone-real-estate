<!DOCTYPE html>
<html lang="sq">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<meta name="theme-color" content="#0E0D12">
<title>Paneli Administrativ — Zone Group Real Estate</title>

<script>
/* Rivendosja e fjalëkalimit ka faqen e vet. Nëse një email i vjetër
   (ose një konfigurim i vjetër i Supabase-it) e sjell përdoruesin këtu,
   e përcjellim menjëherë — PARA se të ngarkohet biblioteka, që tokeni
   i linkut të mos konsumohet nga kjo faqe dhe të humbasë. */
(function () {
  var raw = (location.search || "") + (location.hash || "");
  var looksLikeRecovery =
    /[#?&]type=recovery(&|$)/.test(raw) ||
    /[#?&]token_hash=/.test(raw) ||
    /[#?&]error_code=/.test(raw);
  if (!looksLikeRecovery) return;
  try {
    if (sessionStorage.getItem("zone-reset-forwarded") === "1") return;  // asnjë cikël
    sessionStorage.setItem("zone-reset-forwarded", "1");
  } catch (e) { /* storage e bllokuar — përcillim gjithsesi, një herë */ }
  location.replace("reset-password.html" + location.search + location.hash);
})();
</script>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600&family=Outfit:wght@300;400;500;600&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="admin/admin.css">
</head>
<body>

<a class="skip-link" href="#viewRoot">Kapërce te përmbajtja</a>

<!-- ================================================================
     1 · KONTROLLI I SESIONIT
     ================================================================ -->
<div class="screen" id="screen-boot">
  <div class="boot-screen">
    <span class="spinner" aria-hidden="true"></span>
    <p class="boot-screen__text" id="bootText" role="status">Duke kontrolluar sesionin…</p>
  </div>
</div>

<!-- ================================================================
     2 · HYRJA
     ================================================================ -->
<div class="screen screen--auth" id="screen-login" hidden>
  <div class="auth-box">
    <div class="auth-box__brand">
      <span class="brandmark">
        <span class="brandmark__dot" aria-hidden="true"></span>
        <span>ZONE GROUP
          <span class="brandmark__sub">Real Estate</span>
        </span>
      </span>
    </div>

    <h1 class="auth-box__title">Mirë se vini</h1>
    <p class="auth-box__lede">Hyni në panelin administrativ të Zone Real Estate.</p>

    <p class="auth-msg" id="loginMsg" role="status" aria-live="polite"></p>

    <form id="loginForm" novalidate>
      <div class="field">
        <label class="label" for="email">Email</label>
        <input class="input" id="email" type="email" autocomplete="username"
               inputmode="email" placeholder="emri@kompania.com" required>
      </div>
      <div class="field">
        <label class="label" for="password">Fjalëkalimi</label>
        <input class="input" id="password" type="password" autocomplete="current-password" required>
      </div>
      <button class="btn btn--primary btn--block" type="submit" id="btnLogin">Kyçu</button>
    </form>

    <div class="auth-box__foot">
      <button class="linkbtn" type="button" id="linkForgot">Keni harruar fjalëkalimin?</button>
    </div>
  </div>
</div>

<!-- ================================================================
     3 · RIVENDOSJA E FJALËKALIMIT
     ================================================================ -->
<div class="screen screen--auth" id="screen-forgot" hidden>
  <div class="auth-box">
    <div class="auth-box__brand">
      <span class="brandmark">
        <span class="brandmark__dot" aria-hidden="true"></span>
        <span>ZONE GROUP
          <span class="brandmark__sub">Real Estate</span>
        </span>
      </span>
    </div>

    <h1 class="auth-box__title">Rivendos fjalëkalimin</h1>
    <p class="auth-box__lede">Shkruani email-in tuaj dhe do t'ju dërgojmë një link.</p>

    <p class="auth-msg" id="forgotMsg" role="status" aria-live="polite"></p>

    <form id="forgotForm" novalidate>
      <div class="field">
        <label class="label" for="forgotEmail">Email</label>
        <input class="input" id="forgotEmail" type="email" autocomplete="username"
               inputmode="email" required>
      </div>
      <button class="btn btn--primary btn--block" type="submit" id="btnForgot">Dërgo linkun</button>
    </form>

    <div class="auth-box__foot">
      <button class="linkbtn" type="button" id="linkBackToLogin">Kthehu te hyrja</button>
    </div>
  </div>
</div>

<!-- ================================================================
     4 · QASJA E NDALUAR
     ================================================================ -->
<div class="screen screen--auth" id="screen-denied" hidden>
  <div class="auth-box">
    <h1 class="auth-box__title">Qasje e ndaluar</h1>
    <p class="auth-box__lede" id="deniedMsg"></p>
    <button class="btn btn--ghost" type="button" id="btnDeniedOut">Dil</button>
  </div>
</div>

<!-- ================================================================
     5 · PANELI
     ================================================================ -->
<div class="app" id="app" hidden>

  <!-- ---------- Sidebar ---------- -->
  <aside class="sidebar" id="sidebar" aria-label="Menyja kryesore">
    <div class="sidebar__brand">
      <span class="brandmark">
        <span class="brandmark__dot" aria-hidden="true"></span>
        <span>ZONE GROUP
          <span class="brandmark__sub">Real Estate</span>
        </span>
      </span>
    </div>

    <nav class="sidebar__nav" id="sidebarNav"></nav>

    <div class="sidebar__foot">
      <button class="sidebar__toggle" type="button" id="sidebarToggle"
              aria-label="Zgjero ose mblidh menynë">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"
             stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="m15 18-6-6 6-6"/>
        </svg>
        <span>Mblidh menynë</span>
      </button>
    </div>
  </aside>

  <!-- ---------- Header ---------- -->
  <header class="header">
    <button class="header__burger" type="button" id="burger"
            aria-label="Hap menynë" aria-expanded="false" aria-controls="sidebar">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"
           stroke-linecap="round" aria-hidden="true">
        <path d="M3 12h18M3 6h18M3 18h18"/>
      </svg>
    </button>

    <div class="header__titles">
      <h1 class="header__title" id="headerTitle">Paneli Kryesor</h1>
      <nav class="breadcrumbs" id="breadcrumbs" aria-label="Shtegu"></nav>
    </div>

    <div class="header__search" id="headerSearch"></div>
    <div class="header__spacer"></div>

    <div class="header__actions">
      <button class="pub-state" type="button" id="pubState" hidden></button>
      <div id="headerQuick"></div>
      <div id="headerProfile"></div>
    </div>
  </header>

  <!-- ---------- Përmbajtja ---------- -->
  <main class="main" id="main">
    <div class="main__inner" id="viewRoot" tabindex="-1"></div>
  </main>

</div>

<!-- Konfigurimi publik: vetëm URL dhe çelësi anon. Asnjë sekret këtu. -->
<script src="admin-config.js"></script>
<script type="module" src="admin/app.js"></script>

</body>
</html>
