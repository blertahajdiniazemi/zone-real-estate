  <linearGradient id="line6" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0%" stop-color="#E0518A"/>
    <stop offset="55%" stop-color="#F2874E"/>
    <stop offset="100%" stop-color="#F6C56B"/>
  </linearGradient>
  <linearGradient id="fade6" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0%" stop-color="#fff" stop-opacity="0.42"/>
    <stop offset="100%" stop-color="#fff" stop-opacity="0"/>
  </linearGradient>
  <mask id="refmask6">
    <rect x="0" y="435" width="800" height="165" fill="url(#fade6)"/>
  </mask>
  <filter id="soft6" x="-20%" y="-20%" width="140%" height="140%">
