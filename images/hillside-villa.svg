<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
<defs>
  <linearGradient id="bg6" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0%" stop-color="#241435"/>
    <stop offset="100%" stop-color="#140C1C"/>
  </linearGradient>
  <radialGradient id="glow6" cx="50%" cy="38%" r="58%">
    <stop offset="0%" stop-color="#8B5CD6" stop-opacity="0.55"/>
    <stop offset="55%" stop-color="#E0518A" stop-opacity="0.18"/>
    <stop offset="100%" stop-color="#140C1C" stop-opacity="0"/>
