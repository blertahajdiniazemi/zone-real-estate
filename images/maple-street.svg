<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
<defs>
  <linearGradient id="bg1" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0%" stop-color="#241435"/>
    <stop offset="100%" stop-color="#140C1C"/>
  </linearGradient>
  <radialGradient id="glow1" cx="50%" cy="38%" r="58%">
    <stop offset="0%" stop-color="#8B5CD6" stop-opacity="0.55"/>
    <stop offset="55%" stop-color="#E0518A" stop-opacity="0.18"/>
    <stop offset="100%" stop-color="#140C1C" stop-opacity="0"/>
  </radialGradient>
  <linearGradient id="line1" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0%" stop-color="#E0518A"/>
    <stop offset="55%" stop-color="#F2874E"/>
    <stop offset="100%" stop-color="#F6C56B"/>
  </linearGradient>
  <linearGradient id="fade1" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0%" stop-color="#fff" stop-opacity="0.42"/>
    <stop offset="100%" stop-color="#fff" stop-opacity="0"/>
  </linearGradient>
  <mask id="refmask1">
    <rect x="0" y="435" width="800" height="165" fill="url(#fade1)"/>
  </mask>
  <filter id="soft1" x="-20%" y="-20%" width="140%" height="140%">
    <feGaussianBlur stdDeviation="7"/>
  </filter>
</defs>

<rect width="800" height="600" fill="url(#bg1)"/>
<rect width="800" height="600" fill="url(#glow1)"/>

<!-- soft bloom copy of the linework -->
